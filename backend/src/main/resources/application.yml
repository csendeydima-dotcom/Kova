server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kova}
    username: ${DATABASE_USERNAME:kova}
    password: ${DATABASE_PASSWORD:kova}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 1h

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

kova:
  session-days: ${SESSION_DAYS:30}
  cookie-secure: ${COOKIE_SECURE:false}
  resend-api-key: ${RESEND_API_KEY:}
  email-from: ${EMAIL_FROM:Kova <onboarding@resend.dev>}
  google-client-id: ${GOOGLE_CLIENT_ID:}
  verification-pepper: ${VERIFICATION_PEPPER:local-development-only-change-me}
