services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kova
      POSTGRES_USER: kova
      POSTGRES_PASSWORD: kova
    ports:
      - "5432:5432"
    volumes:
      - kova-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kova -d kova"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/kova
      DATABASE_USERNAME: kova
      DATABASE_PASSWORD: kova
      COOKIE_SECURE: "false"
      VERIFICATION_PEPPER: local-compose-pepper
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Kova <onboarding@resend.dev>}
    ports:
      - "8080:8080"

volumes:
  kova-postgres:
